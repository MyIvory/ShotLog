name: shotlog
description: "Shot analysis app for sport shooters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.10.6
  record: ^6.0.0
  video_thumbnail: ^0.5.3
  path: ^1.9.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  video_player: ^2.8.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  flutter_svg: ^2.0.0
  geolocator: ^13.0.0
  http: ^1.2.2
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "shotlog_launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/active/
    - assets/icons/inactive/
    - assets/images/
